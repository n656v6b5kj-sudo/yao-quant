<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞价选股看板</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 15px; background: #f5f5f5; }
        h2 { margin-bottom: 10px; }
        .status { padding: 8px; border-radius: 4px; margin-bottom: 15px; font-weight: bold; }
        .active { background: #d4edda; color: #155724; }
        .inactive { background: #fff3cd; color: #856404; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: right; font-size: 14px; }
        th { background: #f8f9fa; text-align: center; }
        td:first-child, th:first-child { text-align: left; }
        .up { color: #c0392b; } /* 红涨 */
        .down { color: #27ae60; } /* 绿跌 */
    </style>
</head>
<body>
    <h2>📈 早盘竞价选股</h2>
    <div id="status" class="status inactive">加载中...</div>
    <table>
        <thead>
            <tr>
                <th>代码/名称</th>
                <th>竞价价</th>
                <th>涨幅</th>
                <th>成交量</th>
                <th>成交额</th>
            </tr>
        </thead>
        <tbody id="data-body">
            <tr><td colspan="5" style="text-align:center;">暂无数据</td></tr>
        </tbody>
    </table>

    <script>
        async function fetchData() {
            try {
                const res = await fetch('/api/data');
                const json = await res.json();
                const statusEl = document.getElementById('status');
                if (json.active) {
                    statusEl.textContent = '🟢 当前处于竞价时段 (9:15-9:25)';
                    statusEl.className = 'status active';
                } else {
                    statusEl.textContent = '🟡 非竞价时段，展示最近数据';
                    statusEl.className = 'status inactive';
                }
                
                const tbody = document.getElementById('data-body');
                tbody.innerHTML = '';
                if (json.data && json.data.length > 0) {
                    json.data.forEach(row => {
                        const tr = document.createElement('tr');
                        const pctClass = row.pct >= 0 ? 'up' : 'down';
                        tr.innerHTML = `
                            <td>${row.code}<br>${row.name}</td>
                            <td>${row.price}</td>
                            <td class="${pctClass}">${row.pct}%</td>
                            <td>${row.vol}</td>
                            <td>${row.amount}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">无数据（可能接口暂未更新）</td></tr>';
                }
            } catch (e) {
                console.error(e);
            }
        }
        fetchData();
        setInterval(fetchData, 30000); // 每30秒刷新
    </script>
</body>
</html>
