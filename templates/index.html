<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>妖股挖掘·实战版</title>
<style>
body{margin:0;font-family:-apple-system,sans-serif;background:#f5f5f5}
.header{background:linear-gradient(135deg,#1E3A8A,#1E40AF);color:#fff;padding:14px;text-align:center;font-size:18px}
.sub{font-size:12px;opacity:.8;margin-top:4px}
.card{background:#fff;margin:10px;border-radius:10px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
.up{color:#E53E3E;font-weight:700}
.badge{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}
.S{background:#FEF3C7;color:#92400E}
.A{background:#FEE2E2;color:#991B1B}
.B{background:#DBEAFE;color:#1E40AF}
.C{background:#F3F4F6;color:#666}
.refresh{text-align:center;color:#888;font-size:12px;margin:6px}
</style>
</head>
<body>
<div class="header">
  🐲 妖股挖掘·实战版
  <div class="sub">数据：AkShare/东方财富涨停池（盘后定型，非投资建议）</div>
</div>
<div class="refresh">每5分钟缓存 · 非交易时段可能为空</div>
<div class="card">
  <table>
    <tr><th>代码</th><th>名称</th><th>涨%</th><th>连板</th><th>封板资金</th><th>评分</th><th>评级</th><th>题材</th></tr>
    <tbody id="tb">加载中...</tbody>
  </table>
</div>
<script>
fetch("/api/dashboard")
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("tb").innerHTML = d.map(x=>`
      <tr>
        <td>${x.code}</td>
        <td>${x.name}</td>
        <td class="up">+${x.pct}%</td>
        <td>${x.lianban}板</td>
        <td>${(x.seal_money/10000).toFixed(0)}万</td>
        <td>${x.score}</td>
        <td><span class="badge ${x.grade}">${x.grade}</span></td>
        <td>${x.reason}</td>
      </tr>`).join("");
  })
  .catch(()=>document.getElementById("tb").innerHTML="<tr><td colspan=8>加载失败</td></tr>");
</script>
</body>
</html>
