<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>妖股挖掘</title>
<style>
body{margin:0;font-family:-apple-system,sans-serif;background:#f5f5f5}
.header{background:#1E40AF;color:#fff;padding:14px;text-align:center;font-size:18px}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px}
.up{color:#E53E3E;font-weight:700}
.badge{padding:2px 8px;border-radius:10px;font-size:12px}
.S{background:#FEF3C7;color:#92400E}.A{background:#FEE2E2;color:#991B1B}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
</style>
</head>
<body>
<div class="header">🐲 妖股挖掘神器</div>
<div class="card">
  <table>
    <tr><th>名称</th><th>涨%</th><th>连板</th><th>主力万</th><th>评级</th></tr>
    <tbody id="tb"></tbody>
  </table>
</div>
<script>
fetch("/api/dashboard").then(r=>r.json()).then(d=>{
  document.getElementById("tb").innerHTML =
    d.map(x=>`<tr><td>${x.name}</td><td class="up">+${x.pct}%</td><td>${x.lianban}板</td><td>${x.main_in}</td><td><span class="badge ${x.grade}">${x.grade}</span></td></tr>`).join("");
});
</script>
</body>
</html>
