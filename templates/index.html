<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞价选股看板</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 15px; background: #f5f5f5; }
        h2 { margin-bottom: 10px; }
        .status { padding: 8px; border-radius: 4px; margin-bottom: 10px; font-weight: bold; }
        .active { background: #d4edda; color: #155724; }
        .inactive { background: #fff3cd; color: #856404; }
        .meta { font-size: 12px; color: #666; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
        th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: right; }
        th { background: #f8f9fa; text-align: center; }
        td:first-child, th:first-child { text-align: left; }
        .up { color: #c0392b; }
        .down { color: #27ae60; }
        .S { background: #c0392b; color: #fff; padding: 2px 5px; border-radius: 3px; font-size: 11px; }
        .A { background: #e67e22; color: #fff; padding: 2px 5px; border-radius: 3px; font-size: 11px; }
        .B { background: #f1c40f; color: #333; padding: 2px 5px; border-radius: 3px; font-size: 11px; }
        .C { color: #999; }
    </style>
</head>
<body>
    <h2>📈 早盘竞价选股</h2>
    <div id="status" class="status inactive">加载中...</div>
    <div class="meta" id="meta"></div>
    <table>
        <thead>
            <tr>
                <th>代码/名称</th>
                <th>竞价价</th>
                <th>涨幅</th>
                <th>成交量</th>
                <th>成交额(万)</th>
                <th>评级</th>
            </tr>
        </thead>
        <tbody id="data-body">
            <tr><td colspan="6" style="text-align:center;">暂无数据</td></tr>
        </tbody>
    </table>
    <script>
        async function fetchData() {
            try {
                const res = await fetch('/api/data');
                const json = await res.json();
                document.getElementById('status').textContent = json.active ? '🟢 竞价时段' : '🟡 非竞价时段';
                document.getElementById('status').className = 'status ' + (json.active ? 'active' : 'inactive');
                document.getElementById('meta').textContent = `更新: ${json.time || '-'} | 命中: ${json.count || 0} 只`;
                const tb = document.getElementById('data-body');
                tb.innerHTML = '';
                if (json.data && json.data.length) {
                    json.data.forEach(r => {
                        const tr = document.createElement('tr');
                        const pctCls = parseFloat(r.pct) >= 0 ? 'up' : 'down';
                        tr.innerHTML = `
                            <td>${r.code}<br>${r.name}</td>
                            <td>${r.price}</td>
                            <td class="${pctCls}">${r.pct}%</td>
                            <td>${r.vol}</td>
                            <td>${r.amount}</td>
                            <td><span class="${r.level}">${r.level}</span></td>
                        `;
                        tb.appendChild(tr);
                    });
                } else {
                    tb.innerHTML = '<tr><td colspan="6" style="text-align:center;">无数据（接口未更新或非竞价）</td></tr>';
                }
            } catch(e) { console.error(e); }
        }
        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
